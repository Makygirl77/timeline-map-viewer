<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Timeline Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Left Sidebar: Controls -->
        <div class="sidebar">
            <h1>🗺️ Timeline Map</h1>
            
            <!-- Year Filter -->
            <div class="filter-section">
                <label for="year-select">📅 Year:</label>
                <select id="year-select">
                    <option value="">All Years</option>
                </select>
            </div>

            <!-- Month Filter -->
            <div class="filter-section">
                <label for="month-select">📆 Month:</label>
                <select id="month-select" disabled>
                    <option value="">All Months</option>
                </select>
            </div>

            <!-- Day Filter -->
            <div class="filter-section">
                <label for="day-select">📋 Day:</label>
                <select id="day-select" disabled>
                    <option value="">All Days</option>
                </select>
            </div>

            <!-- Playback Controls -->
            <div class="playback-section">
                <button id="play-btn" class="btn btn-play">▶️ Play Animation</button>
                <button id="stop-btn" class="btn btn-stop" disabled>⏹️ Stop</button>
            </div>

            <!-- Stats -->
            <div class="stats-section">
                <p><strong>📍 Locations Found:</strong> <span id="location-count">0</span></p>
                <p><strong>⏱️ Time Range:</strong></p>
                <p id="time-range" style="font-size: 12px;">-</p>
                <p><strong>🛣️ Distance Traveled:</strong></p>
                <p id="distance-traveled" style="font-size: 12px;">-</p>
            </div>
        </div>

        <!-- Right Side: Map -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
